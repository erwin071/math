<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100">
  <!-- Title -->
  <text x="130" y="15" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Pencil Lengths (cm)</text>

  <!-- Axis line -->
  <line x1="20" y1="70" x2="240" y2="70" stroke="#333" stroke-width="1.5"/>

  <!-- Ticks and labels: positions 30,80,130,180,230 for values 10-14 -->
  <line x1="30" y1="70" x2="30" y2="75" stroke="#333" stroke-width="1"/>
  <text x="30" y="85" font-size="9" fill="#333" text-anchor="middle">10</text>

  <line x1="80" y1="70" x2="80" y2="75" stroke="#333" stroke-width="1"/>
  <text x="80" y="85" font-size="9" fill="#333" text-anchor="middle">11</text>

  <line x1="130" y1="70" x2="130" y2="75" stroke="#333" stroke-width="1"/>
  <text x="130" y="85" font-size="9" fill="#333" text-anchor="middle">12</text>

  <line x1="180" y1="70" x2="180" y2="75" stroke="#333" stroke-width="1"/>
  <text x="180" y="85" font-size="9" fill="#333" text-anchor="middle">13</text>

  <line x1="230" y1="70" x2="230" y2="75" stroke="#333" stroke-width="1"/>
  <text x="230" y="85" font-size="9" fill="#333" text-anchor="middle">14</text>

  <!-- Dots: 10→2 dots, 11→1 dot, 12→4 dots, 13→1 dot, 14→2 dots -->
  <!-- Value 10: 2 dots -->
  <circle cx="30" cy="55" r="5" fill="#2563eb"/>
  <circle cx="30" cy="40" r="5" fill="#2563eb"/>

  <!-- Value 11: 1 dot -->
  <circle cx="80" cy="55" r="5" fill="#2563eb"/>

  <!-- Value 12: 4 dots -->
  <circle cx="130" cy="55" r="5" fill="#2563eb"/>
  <circle cx="130" cy="40" r="5" fill="#2563eb"/>
  <circle cx="130" cy="25" r="5" fill="#2563eb"/>
  <circle cx="130" cy="10" r="5" fill="#2563eb"/>

  <!-- Value 13: 1 dot -->
  <circle cx="180" cy="55" r="5" fill="#2563eb"/>

  <!-- Value 14: 2 dots -->
  <circle cx="230" cy="55" r="5" fill="#2563eb"/>
  <circle cx="230" cy="40" r="5" fill="#2563eb"/>
</svg>