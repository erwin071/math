<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 100">
  <!-- Title -->
  <text x="130" y="15" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Number of Books Read</text>

  <!-- Axis line -->
  <line x1="20" y1="70" x2="240" y2="70" stroke="#333" stroke-width="1.5"/>

  <!-- Ticks and labels: positions 30,80,130,180,230 for values 1-5 -->
  <line x1="30" y1="70" x2="30" y2="75" stroke="#333" stroke-width="1"/>
  <text x="30" y="85" font-size="9" fill="#333" text-anchor="middle">1</text>

  <line x1="80" y1="70" x2="80" y2="75" stroke="#333" stroke-width="1"/>
  <text x="80" y="85" font-size="9" fill="#333" text-anchor="middle">2</text>

  <line x1="130" y1="70" x2="130" y2="75" stroke="#333" stroke-width="1"/>
  <text x="130" y="85" font-size="9" fill="#333" text-anchor="middle">3</text>

  <line x1="180" y1="70" x2="180" y2="75" stroke="#333" stroke-width="1"/>
  <text x="180" y="85" font-size="9" fill="#333" text-anchor="middle">4</text>

  <line x1="230" y1="70" x2="230" y2="75" stroke="#333" stroke-width="1"/>
  <text x="230" y="85" font-size="9" fill="#333" text-anchor="middle">5</text>

  <!-- Dots: 1→2 dots, 2→1 dot, 3→3 dots, 4→1 dot, 5→1 dot -->
  <!-- Value 1: 2 dots -->
  <circle cx="30" cy="55" r="5" fill="#2563eb"/>
  <circle cx="30" cy="40" r="5" fill="#2563eb"/>

  <!-- Value 2: 1 dot -->
  <circle cx="80" cy="55" r="5" fill="#2563eb"/>

  <!-- Value 3: 3 dots -->
  <circle cx="130" cy="55" r="5" fill="#2563eb"/>
  <circle cx="130" cy="40" r="5" fill="#2563eb"/>
  <circle cx="130" cy="25" r="5" fill="#2563eb"/>

  <!-- Value 4: 1 dot -->
  <circle cx="180" cy="55" r="5" fill="#2563eb"/>

  <!-- Value 5: 1 dot -->
  <circle cx="230" cy="55" r="5" fill="#2563eb"/>
</svg>